# Relative paths are resolved against the folder containing this file.
paths:
  archives: data/archives
  raw: data/raw
  processed: data/processed
  models: models
  results: results

datasets:
  femto:
    # PHM Society mirror of the NASA Prognostics Data Repository, data set 10
    url: https://phm-datasets.s3.amazonaws.com/NASA/10.+FEMTO+Bearing.zip
    archive: FEMTO_Bearing.zip
    archive_bytes: 1157035288
    inner_archive: FEMTOBearingDataSet.zip
    sampling_rate_hz: 25600
    snapshot_length: 2560
    snapshot_interval_s: 10

  ims:
    # Same mirror, data set 4
    url: https://phm-datasets.s3.amazonaws.com/NASA/4.+Bearings.zip
    archive: IMS_Bearings.zip
    archive_bytes: 1075597174
    inner_archive: IMS.7z
    test: 2nd_test
    sampling_rate_hz: 20000
    snapshot_length: 20480
    snapshot_interval_s: 600
    # Same rule as for FEMTO (the part before any bearing shows a sustained RMS
    # change, with margin): on test 2 bearing 1 starts to rise at about 52 % of the
    # test, so the first 40 % (2.7 days) count as healthy. 15 % would leave almost
    # nothing after the 100-snapshot baseline and the 128-snapshot forecast window.
    healthy_fraction: 0.4

features:
  # In Hz, the same for both datasets, and no higher than the IMS Nyquist frequency (10 kHz)
  bands_hz: [0, 500, 1000, 2000, 3000, 4000, 6000, 8000, 10000]
  # Wide band above the shaft-related low frequencies, where impacts excite resonances
  envelope_band_hz: [2000, 9000]
  envelope_min_hz: 20
  envelope_max_hz: 1000
  defect_harmonics: 3

normalization:
  # Each bearing is z-scored against its own first snapshots (16.7 min on FEMTO,
  # 16.7 h on IMS). Only data available at that point is used.
  baseline_snapshots: 100
  # The first 15 % of each life counts as healthy: used for training and for counting
  # false alarms. No FEMTO bearing shows a sustained RMS change before 15 % of its life.
  healthy_fraction: 0.15

evaluation:
  # Every FEMTO bearing whose record ends at failure, in four groups that mix the
  # three operating conditions. Each group is tested once; see evaluation.run_protocol.
  groups:
    - [Bearing1_1, Bearing1_6, Bearing2_3, Bearing2_7]
    - [Bearing1_2, Bearing1_7, Bearing2_4, Bearing3_1]
    - [Bearing1_3, Bearing2_1, Bearing2_5, Bearing3_2]
    - [Bearing1_5, Bearing2_2, Bearing2_6, Bearing3_3]
  # Its end of life is ambiguous (see femto.py), so it only ever contributes healthy training data
  train_only: [Bearing1_4]
  # Share of held-out healthy snapshots allowed to be in alarm
  false_alarm_rates: [0.001, 0.005, 0.01, 0.05]
  # Only for ROC/PR: "the last 10 % of a life is worn" is a convention, not a label
  wear_fraction: 0.1

transformer:
  # window / horizon in snapshots. On FEMTO 128 snapshots are 21 min of history,
  # on IMS 21 h. Patches tile the window: (window - patch) % stride == 0.
  variants:
    w128_p16: {window: 128, patch: 16, stride: 8, horizon: 16}
    w64_p8: {window: 64, patch: 8, stride: 4, horizon: 8}
    w32_p4: {window: 32, patch: 4, stride: 2, horizon: 8}
  model:
    d_model: 64
    n_heads: 4
    n_layers: 2
    d_ff: 128
    dropout: 0.1
    epochs: 5
    batch_size: 64
    lr: 0.001
    weight_decay: 0.0001
    seed: 0

chronos:
  # Zero-shot comparison, same window and horizon as the transformer 128/16
  model: amazon/chronos-bolt-small
  window: 128
  horizon: 16
  batch_size: 1024

demo:
  # Only derived data goes into app/data: the raw recordings may not be redistributed
  femto_bearings: [Bearing1_1, Bearing1_3, Bearing2_2, Bearing2_5, Bearing2_7, Bearing3_2]
  methods: [rms, ecod, transformer_w128_p16]
  forecaster: w128_p16
  forecast_channels: [rms, kurtosis, band_500_1000, band_8000_10000, env_modulation, env_peakiness]
  spectrum_bins: 128
  spectrum_max_hz: 10000
  envelope_bin_hz: 10
  envelope_max_hz: 700

alarm:
  # All in snapshots: 10 s each on FEMTO, 10 min on IMS
  smooth: 5
  raise_after: 3
  clear_after: 12
  clip: 100
